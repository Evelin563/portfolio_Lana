<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Adivinhação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="dino">🦖</div>

    <h1>Jogo de Adivinhação</h1>

    <p>
      O dinossauro pensou em um número entre 1 e 100.
      Tente descobrir antes que suas tentativas acabem!
    </p>

    <input type="number" id="palpite" placeholder="Digite seu palpite">

    <button id="botaoChutar">Chutar</button>

    <p id="mensagem"></p>

    <p id="tentativas"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
