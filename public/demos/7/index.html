<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Parquímetro Água-Viva</title>

  <!-- Nome correto do seu CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <div class="jellyfish">🪼</div>

    <h1>Parquímetro</h1>

    <p class="descricao">
      Insira o valor pago e veja o tempo permitido no estacionamento.
    </p>

    <div class="tabela-tempos">
      <p>R$ 1,00 → 30 minutos</p>
      <p>R$ 1,75 → 60 minutos</p>
      <p>R$ 3,00 → 120 minutos</p>
    </div>

    <input
      type="number"
      id="valor"
      placeholder="Ex: 1.75"
      min="0"
      step="0.01"
    >

    <button onclick="calcularEstacionamento()">
      Calcular tempo
    </button>

    <section id="resultado" class="resultado">
      <p>🌊 Aguardando o valor...</p>
    </section>
  </main>

  <!-- Nome correto do seu JavaScript -->
  <script src="script.js"></script>
</body>
</html>
