<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Recrutas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="pagina">
    <section class="cadastro">

      <div class="imagem-topo">
        <img src="image01.jpg" alt="Eren Yeager">
        <div class="sombra-topo"></div>
        <div class="titulo-topo">
          <p>DIVISÃO DE RECONHECIMENTO</p>
          <h1>Cadastro de Recruta</h1>
        </div>
      </div>

      <div class="conteudo">
        <p class="descricao">
          Preencha seus dados. Ao digitar o CEP, rua, bairro, cidade e estado serão encontrados automaticamente.
        </p>

        <form id="formCadastro">

          <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
          </div>

          <div class="linha">
            <div class="campo">
              <label for="email">E-mail</label>
              <input type="email" id="email" placeholder="exemplo@email.com">
            </div>

            <div class="campo">
              <label for="telefone">Telefone</label>
              <input type="text" id="telefone" placeholder="(00) 00000-0000">
            </div>
          </div>

          <div class="campo">
            <label for="cep">CEP</label>
            <input type="text" id="cep" placeholder="00000-000" maxlength="9">
            <small>Digite o CEP para localizar o endereço.</small>
          </div>

          <div class="campo">
            <label for="rua">Rua</label>
            <input type="text" id="rua" placeholder="Será preenchida pelo CEP">
          </div>

          <div class="linha">
            <div class="campo">
              <label for="bairro">Bairro</label>
              <input type="text" id="bairro" placeholder="Será preenchido pelo CEP">
            </div>

            <div class="campo numero">
              <label for="numero">Número</label>
              <input type="text" id="numero" placeholder="Nº">
            </div>
          </div>

          <div class="linha">
            <div class="campo">
              <label for="cidade">Cidade</label>
              <input type="text" id="cidade" placeholder="Será preenchida pelo CEP">
            </div>

            <div class="campo estado">
              <label for="estado">UF</label>
              <input type="text" id="estado" placeholder="UF" maxlength="2">
            </div>
          </div>

          <button type="submit" class="botao-salvar">Salvar cadastro</button>
          <button type="button" id="limpar" class="botao-limpar">Apagar informações</button>

          <p id="mensagem"></p>
        </form>
      </div>

      <div class="imagem-rodape">
        <img src="image02.jpg" alt="Attack on Titan">
        <div class="frase">“Se você vencer, vive. Se perder, morre.”</div>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
